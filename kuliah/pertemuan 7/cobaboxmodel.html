<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Box Model</title>
    <style>
        .kotak1 {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            margin-top: 50px;
            margin-bottom: 70px;

        }

        .kotak2 {
            width: 150px;
            height: 150px;
            background-color:darkslategray;
            margin-left: 80px;
            transition: 1s;
            transform-origin: bottom right;
            padding: 15px;
            border: 5px solid bisque;
            color: white;
            box-sizing: border-box;
            border-radius: 30px;
        }

        .kotak2:hover {
            margin-left: 0;
            transform: rotate(180deg);
            transform: skew(15deg);
        }
    </style>
</head>
<body>
   <div class="kotak1">kotak 1</div> 
   <div class="kotak2">Lorem ipsum dolor sit amet consectetur adipisicing elit. At, architecto.</div> 
</body>
</html>
