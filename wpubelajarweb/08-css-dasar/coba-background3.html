<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Background</title>

    <style>
        body {
            background-color: lightblue;
            background-image: linear-gradient(to right top, lightblue, lemonchiffon);
            height: 100vh;
        }

        .kotak1 {
            width: 300px;
            height: 300px;
            background-color: lightgoldenrodyellow;
            background-image: linear-gradient(to bottom, lightpink, lightblue);
        }
        .kotak2 {
            width: 300px;
            height: 300px;
            background-color: lightgoldenrodyellow;
            background-image: radial-gradient( lightcyan, grey);
        }
        .kotak3 {
            width: 300px;
            height: 300px;
            background-color: lightgoldenrodyellow;
            background-image: conic-gradient( tan, lightgreen, beige);
        }
    </style>
</head>
<body>
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
</body>
</html>
